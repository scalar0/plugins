#:schema https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json

source_dir = "../../../.config/git/hooks"

[pre-commit]
parallel = false

[post-commit]
parallel = true

[pre-push]
parallel = false

[pre-merge-commit]
only     = ["ref: main", "ref: master"]
parallel = false

[[remotes]]
configs = ["./extensions/defaults.toml", "extensions/py.toml"]
git_url = "git@github.com:scalar0/hooks"
refetch = true
